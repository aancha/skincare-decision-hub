<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">SkinCare Hub demo poster</title>
  <desc id="description">A synthetic-data demo poster highlighting the Overview, Catalog, Shortlist, and Routine product flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173f38"/>
      <stop offset="1" stop-color="#285f57"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#071b18" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="112" cy="94" r="190" fill="#79a69a" opacity="0.24"/>
  <circle cx="1190" cy="650" r="280" fill="#f2b680" opacity="0.17"/>
  <g transform="translate(82 72)">
    <text x="0" y="28" fill="#cfe2d8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4">TWO-MINUTE PRODUCT WALKTHROUGH</text>
    <text x="0" y="112" fill="#fff" font-family="Georgia, serif" font-size="60" font-weight="700">From concern to confident shortlist.</text>
    <text x="0" y="164" fill="#e3eee9" font-family="Arial, Helvetica, sans-serif" font-size="26">A decision-first skincare workflow, shown with fictional products.</text>
    <g transform="translate(0 226)" filter="url(#shadow)">
      <rect width="1116" height="314" rx="28" fill="#f8faf8"/>
      <rect x="24" y="24" width="1068" height="56" rx="16" fill="#e8f0ec"/>
      <text x="52" y="59" fill="#173f38" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">OVERVIEW</text>
      <text x="198" y="59" fill="#52645f" font-family="Arial, Helvetica, sans-serif" font-size="18">Catalog</text>
      <text x="306" y="59" fill="#52645f" font-family="Arial, Helvetica, sans-serif" font-size="18">Workspace</text>
      <text x="448" y="59" fill="#52645f" font-family="Arial, Helvetica, sans-serif" font-size="18">Shortlist</text>
      <g transform="translate(28 112)" font-family="Arial, Helvetica, sans-serif">
        <rect width="236" height="162" rx="18" fill="#fff" stroke="#d7e2dd"/>
        <text x="22" y="40" fill="#2f6f67" font-size="14" font-weight="700">01 · CONCERN</text>
        <text x="22" y="78" fill="#173f38" font-size="23" font-weight="700">Dry, reactive skin</text>
        <text x="22" y="116" fill="#687772" font-size="16">Route before ranking</text>
        <rect x="256" width="236" height="162" rx="18" fill="#fff" stroke="#d7e2dd"/>
        <text x="278" y="40" fill="#2f6f67" font-size="14" font-weight="700">02 · COMPARE</text>
        <text x="278" y="78" fill="#173f38" font-size="23" font-weight="700">Evidence + catch</text>
        <text x="278" y="116" fill="#687772" font-size="16">Retailer differences visible</text>
        <rect x="512" width="236" height="162" rx="18" fill="#fff" stroke="#d7e2dd"/>
        <text x="534" y="40" fill="#2f6f67" font-size="14" font-weight="700">03 · DECIDE</text>
        <text x="534" y="78" fill="#173f38" font-size="23" font-weight="700">Champion + backup</text>
        <text x="534" y="116" fill="#687772" font-size="16">Gaps stay explicit</text>
        <rect x="768" width="288" height="162" rx="18" fill="#fff6ef" stroke="#e8d1be"/>
        <text x="790" y="40" fill="#9b5d45" font-size="14" font-weight="700">04 · CHECK</text>
        <text x="790" y="78" fill="#6b4435" font-size="23" font-weight="700">Routine + safety</text>
        <text x="790" y="116" fill="#80685e" font-size="16">Order, budget, conflicts</text>
      </g>
    </g>
  </g>
  <text x="82" y="674" fill="#cfe2d8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">INDEPENDENT · NOT RETAILER-ENDORSED · DECISION SUPPORT, NOT MEDICAL ADVICE</text>
</svg>
